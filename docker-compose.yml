services:
  postgres:
    image: postgres:16-alpine
    container_name: trademun-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: trademun
      POSTGRES_PASSWORD: 19540Asemun*
      POSTGRES_DB: trademun
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=16MB
      -c maintenance_work_mem=64MB
      -c max_connections=50
      -c effective_cache_size=768MB
      -c max_parallel_workers_per_gather=0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trademun -d trademun"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trademun-api
    restart: unless-stopped
    ports:
      - "8000:7860"
    env_file:
      - .env
    volumes:
      - ./data:/home/user/app/data
      - ./fonts:/home/user/app/fonts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trademun-scheduler
    restart: unless-stopped
    command: ["python", "-m", "api.scheduler_worker"]
    env_file:
      - .env
    volumes:
      - ./data:/home/user/app/data
      - ./fonts:/home/user/app/fonts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.trademun.ir
        NEXT_PUBLIC_WS_URL: wss://api.trademun.ir/api/ws/live
    container_name: trademun-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_OPTIONS=--max-old-space-size=768
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: trademun-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - frontend

volumes:
  postgres_data:
  caddy_data:
  caddy_config: