services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trademun-api
    restart: unless-stopped
    ports:
      - "8000:7860"
    env_file:
      - .env
    volumes:
      - ./data:/home/user/app/data
      - ./fonts:/home/user/app/fonts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trademun-scheduler
    restart: unless-stopped
    command: ["python", "-m", "api.scheduler_worker"]
    env_file:
      - .env
    volumes:
      - ./data:/home/user/app/data
      - ./fonts:/home/user/app/fonts
    healthcheck:
      disable: true  # 🔴 غیرفعال کردن healthcheck برای scheduler
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.trademun.ir
        NEXT_PUBLIC_WS_URL: wss://api.trademun.ir/api/ws/live
    container_name: trademun-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_OPTIONS=--max-old-space-size=768
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: trademun-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - frontend

volumes:
  caddy_data:
  caddy_config: